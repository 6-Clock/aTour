name: PytestRuff

# Triggers on push and pull_request to run tests and linting on the backend
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    # PostgreSQL service container — matches the DB the app connects to locally
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atour
          POSTGRES_PASSWORD: atour
          POSTGRES_DB: atour_test
        ports:
          - 5432:5432
        # Wait until postgres is ready before running steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Inject DATABASE_URL so SQLAlchemy can connect during tests
    env:
      DATABASE_URL: postgresql://atour:atour@localhost:5432/atour_test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install backend dependencies from requirements.txt, plus pytest and ruff
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest ruff httpx

      - name: Verify Pytest
        run: pytest --version

      - name: Verify Ruff
        run: ruff --version

      # PYTHONPATH includes backend/ so imports like `from app.main import app` resolve
      - name: Run Pytest
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
          pytest backend/tests

      # Lint the backend directory
      # Remove || true once you want Ruff failures to block the PR
      - name: Run Ruff
        run: |
          ruff check backend/ || true
